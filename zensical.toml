# Site config for Zensical (https://zensical.org).
# Don't add a `nav` here: scripts/docs.py generates it from research/ at build time
# (section titles come from each folder's README.md heading, order from numeric prefixes).

[project]
site_name = "Agent Evals & Guardrails"
site_description = "A practitioner's guide to evaluating and guarding agentic RAG applications."
site_url = "https://sarangk90.github.io/awesome-agent-evals-and-guardrails/"
repo_url = "https://github.com/Sarangk90/awesome-agent-evals-and-guardrails"
repo_name = "Sarangk90/awesome-agent-evals-and-guardrails"
edit_uri = "edit/main/research/"
docs_dir = "research"

# Diagrams: every ```mermaid block is rendered by overrides/assets/diagrams.js.
extra_css = ["assets/diagrams.css"]
extra_javascript = ["assets/diagrams.js"]

[project.theme]
custom_dir = "overrides"
language = "en"
features = [
  "content.action.edit",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.instant.progress",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[project.theme.icon]
logo = "lucide/shield-check"

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/Sarangk90/awesome-agent-evals-and-guardrails"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
tables = {}
toc.permalink = true
# GitHub-compatible heading anchors, so links work both on github.com and on the site.
toc.slugify = { object = "pymdownx.slugs.slugify", kwds = { case = "lower" } }
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.mark = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "diagram", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}
